<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Gesture Wheelchair Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:        #080d18;
      --surface:   #0f1829;
      --card:      #111f35;
      --border:    #1e3a5f;
      --accent:    #3b82f6;
      --accent2:   #06b6d4;
      --green:     #10b981;
      --amber:     #f59e0b;
      --red:       #ef4444;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --mono:      'Share Tech Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Barlow', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px;
      background-image:
        radial-gradient(ellipse 70% 35% at 50% 0%, rgba(59,130,246,0.10) 0%, transparent 65%);
    }

    /* ── Header ── */
    header {
      text-align: center;
      margin-bottom: 24px;
    }
    header .title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent2);
    }
    header .subtitle {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 5px;
      letter-spacing: 0.2em;
    }

    /* ── Main Card ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 0 80px rgba(59,130,246,0.07), 0 24px 48px rgba(0,0,0,0.6);
    }

    /* ── Buttons ── */
    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }
    .btn {
      padding: 11px 8px;
      border: none;
      border-radius: 10px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: filter 0.15s, transform 0.1s;
    }
    .btn:hover  { filter: brightness(1.2); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); filter: brightness(0.85); }
    .btn-cam  { background: var(--accent);  color: #fff; }
    .btn-port { background: var(--amber);   color: #1a0f00; }

    /* ── Camera Box ── */
    #camera-wrap {
      position: relative;
      border: 2px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      aspect-ratio: 1;
      width: 100%;
      box-shadow: 0 0 30px rgba(59,130,246,0.15) inset;
    }
    #camera-wrap canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Overlay corner accents */
    #camera-wrap::before,
    #camera-wrap::after {
      content: '';
      position: absolute;
      width: 22px; height: 22px;
      border-color: var(--accent2);
      border-style: solid;
      z-index: 10;
    }
    #camera-wrap::before { top: 10px; left: 10px;  border-width: 2px 0 0 2px; border-radius: 4px 0 0 0; }
    #camera-wrap::after  { bottom: 10px; right: 10px; border-width: 0 2px 2px 0; border-radius: 0 0 4px 0; }

    /* ── Gesture Status ── */
    .gesture-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 14px 0 10px;
      gap: 10px;
    }
    .gesture-badge {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 8px;
      text-align: center;
    }
    .gesture-badge .label {
      font-family: var(--mono);
      font-size: 0.62rem;
      color: var(--muted);
      letter-spacing: 0.12em;
      margin-bottom: 4px;
    }
    .gesture-badge .value {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent2);
      letter-spacing: 0.08em;
    }
    .gesture-badge.active-left  .value { color: #60a5fa; }
    .gesture-badge.active-right .value { color: #f472b6; }
    .gesture-badge.active-safe  .value { color: var(--red); }

    /* ── Servo Visual ── */
    .servo-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
    }
    .servo-label {
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.1em;
    }
    .servo-angle {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--green);
      min-width: 70px;
      text-align: center;
    }
    /* Arrow indicator */
    .arrow-indicator {
      font-size: 1.5rem;
      transition: transform 0.3s ease;
    }

    /* ── Serial Monitor ── */
    .monitor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .monitor-title {
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.15em;
    }
    .clear-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 5px;
      padding: 2px 9px;
      font-size: 0.65rem;
      font-family: var(--mono);
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .clear-btn:hover { color: var(--text); border-color: var(--muted); }

    #monitor {
      background: #04080f;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-family: var(--mono);
      font-size: 0.72rem;
      line-height: 1.75;
      color: var(--green);
      height: 170px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    #monitor .log-safe    { color: var(--red); }
    #monitor .log-action  { color: #60a5fa; }
    #monitor .log-system  { color: var(--accent2); }
    #monitor .log-sensor  { color: var(--green); }
  </style>
</head>
<body>

<header>
  <div class="title">🦽 AI Gesture Wheelchair</div>
  <div class="subtitle">HEAD POSE CONTROL · ULTRASONIC SAFETY · WEB SERIAL</div>
</header>

<div class="card">

  <div class="btn-row">
    <button class="btn btn-cam"  onclick="initAI()">▶ Start Camera</button>
    <button class="btn btn-port" onclick="connectSerial()">🔌 Connect Arduino</button>
  </div>

  <div id="camera-wrap">
    <canvas id="canvas"></canvas>
  </div>

  <div class="gesture-row">
    <div class="gesture-badge" id="badge-gesture">
      <div class="label">HEAD GESTURE</div>
      <div class="value" id="gesture-text">---</div>
    </div>
    <div class="gesture-badge" id="badge-conf">
      <div class="label">CONFIDENCE</div>
      <div class="value" id="conf-text">--%</div>
    </div>
    <div class="gesture-badge" id="badge-cmd">
      <div class="label">COMMAND</div>
      <div class="value" id="cmd-text">--</div>
    </div>
  </div>

  <div class="servo-row">
    <div class="servo-label">SERVO ANGLE</div>
    <div class="arrow-indicator" id="arrow">➡</div>
    <div class="servo-angle" id="servo-angle">90°</div>
    <div class="servo-label">DIRECTION</div>
    <div class="servo-angle" id="direction-text" style="font-size:1rem; color:var(--muted);">STRAIGHT</div>
  </div>

  <div class="monitor-header">
    <div class="monitor-title">◉ SERIAL MONITOR</div>
    <button class="clear-btn" onclick="document.getElementById('monitor').innerHTML=''">CLEAR</button>
  </div>
  <div id="monitor"><span class="log-system">-- AI Gesture Wheelchair Ready --</span><br></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>

<script>
  const MODEL_URL = "https://teachablemachine.withgoogle.com/models/fTto7tVwT/";
  let model, webcam, ctx, writer, port;
  let lastCmd = "";
  let lineBuffer = "";

  // ── Logging ──────────────────────────────────────────────
  function writeLog(msg, type = "sensor") {
    const mon = document.getElementById("monitor");
    const span = document.createElement("span");
    span.className = "log-" + type;
    span.innerHTML = msg;
    mon.appendChild(span);
    mon.appendChild(document.createElement("br"));
    mon.scrollTop = mon.scrollHeight;
    while (mon.childNodes.length > 120) mon.removeChild(mon.firstChild);
  }

  // ── Update UI panels ─────────────────────────────────────
  function updateUI(gesture, confidence, cmd, safetyTriggered) {
    document.getElementById("gesture-text").textContent = gesture || "---";
    document.getElementById("conf-text").textContent    = confidence ? confidence + "%" : "--%";
    document.getElementById("cmd-text").textContent     = cmd || "--";

    let angle = 90, direction = "STRAIGHT", arrow = "➡";
    if (safetyTriggered) {
      angle = 90; direction = "⚠ SAFE STOP"; arrow = "🛑";
    } else if (cmd === "L") {
      angle = 45;  direction = "LEFT";    arrow = "↰";
    } else if (cmd === "R") {
      angle = 135; direction = "RIGHT";   arrow = "↱";
    }
    document.getElementById("servo-angle").textContent    = angle + "°";
    document.getElementById("direction-text").textContent = direction;
    document.getElementById("arrow").textContent          = arrow;

    const badge = document.getElementById("badge-gesture");
    badge.className = "gesture-badge" +
      (cmd === "L" ? " active-left" : cmd === "R" ? " active-right" : safetyTriggered ? " active-safe" : "");
  }

  // ── Web Serial: Connect to Arduino ───────────────────────
  async function connectSerial() {
    try {
      port = await navigator.serial.requestPort();
      await port.open({ baudRate: 9600 });
      writer = port.writable.getWriter();
      writeLog("✔ CONNECTED TO ARDUINO", "system");
      readLoop();
    } catch (e) {
      writeLog("⚠ " + e, "safe");
    }
  }

  // ── Read incoming Arduino serial data ────────────────────
  async function readLoop() {
    const reader  = port.readable.getReader();
    const decoder = new TextDecoder();
    try {
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        lineBuffer += decoder.decode(value);
        if (lineBuffer.includes("\n")) {
          const lines = lineBuffer.split("\n");
          for (let i = 0; i < lines.length - 1; i++) {
            const line = lines[i].trim();
            if (!line) continue;
            const type = line.startsWith(">>>") ? "safe"
                       : line.startsWith("ACTION") ? "action"
                       : line.startsWith("SYSTEM") ? "system"
                       : "sensor";
            writeLog(line, type);
          }
          lineBuffer = lines[lines.length - 1];
        }
      }
    } catch (e) { writeLog("⚠ Read error: " + e, "safe"); }
  }

  // ── Load Teachable Machine Model + Webcam ────────────────
  async function initAI() {
    writeLog("Loading AI pose model...", "system");
    model  = await tmPose.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
    webcam = new tmPose.Webcam(460, 460, true);
    await webcam.setup();
    await webcam.play();

    const canvas  = document.getElementById("canvas");
    canvas.width  = 460;
    canvas.height = 460;
    ctx = canvas.getContext("2d");

    writeLog("✔ Camera & AI Model Ready. Show your head gestures!", "system");
    window.requestAnimationFrame(predictionLoop);
  }

  // ── Main AI prediction loop ───────────────────────────────
  async function predictionLoop() {
    webcam.update();

    const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
    const predictions = await model.predict(posenetOutput);

    // Find top prediction
    let topClass = "", topProb = 0;
    for (const p of predictions) {
      if (p.probability > topProb) {
        topProb  = p.probability;
        topClass = p.className;
      }
    }

    const confPct = (topProb * 100).toFixed(0);
    const g       = topClass.toUpperCase();
    const cmd     = g.includes("LEFT") ? "L" : g.includes("RIGHT") ? "R" : "S";

    updateUI(topClass, confPct, topProb > 0.90 ? cmd : "--", false);

    // Send command only when confidence > 90%
    if (topProb > 0.90 && writer && cmd !== lastCmd) {
      await writer.write(new TextEncoder().encode(cmd));
      lastCmd = cmd;
      const label = cmd === "L" ? "HEAD LEFT → Servo 45°"
                  : cmd === "R" ? "HEAD RIGHT → Servo 135°"
                  : "HEAD STRAIGHT → Servo 90°";
      writeLog("SENT: " + label, "action");
    }

    // Draw camera feed + pose skeleton
    ctx.drawImage(webcam.canvas, 0, 0);
    if (pose) {
      tmPose.drawKeypoints(pose.keypoints, 0.5, ctx);
      tmPose.drawSkeleton(pose.keypoints, 0.5, ctx);
    }

    window.requestAnimationFrame(predictionLoop);
  }
</script>

</body>
</html>
